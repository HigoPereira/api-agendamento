<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cliente API Agendamento</title>
</head>
<body>

    <h1>Login da API</h1>

    <input
        type="text"
        id="usuario"
        placeholder="Usuário"
    >

    <br><br>

    <input
        type="password"
        id="senha"
        placeholder="Senha"
    >

    <br><br>

    <button onclick="fazerLogin()">
        Entrar
    </button>

    <button onclick="listarServicos()">
        Listar Serviços
    </button>

    <button onclick="listarClientes()">
        Listar Clientes
    </button>

    <p id="resultado"></p>

    <hr>

    <h2>Serviços</h2>

    <ul id="listaServicos"></ul>

    <h2>Clientes</h2>

    <ul id="listaClientes"></ul>

    <script>

        async function fazerLogin() {

            const usuario =
                document.getElementById('usuario').value;

            const senha =
                document.getElementById('senha').value;

            const resposta = await fetch(
                'http://localhost:3000/auth/login',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        usuario,
                        senha
                    })
                }
            );

            const dados = await resposta.json();

            if (dados.token) {

                localStorage.setItem(
                    'token',
                    dados.token
                );

                document.getElementById(
                    'resultado'
                ).innerText =
                    'Login realizado com sucesso!';

            } else {

                document.getElementById(
                    'resultado'
                ).innerText =
                    'Erro ao fazer login';

            }

        }

        async function listarServicos() {

            const token =
                localStorage.getItem('token');

            const resposta = await fetch(
                'http://localhost:3000/servicos',
                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const servicos =
                await resposta.json();

            const lista =
                document.getElementById('listaServicos');

            lista.innerHTML = '';

            servicos.forEach(servico => {

                lista.innerHTML += `
                    <li>
                        ${servico.nome}
                        - R$ ${servico.preco}
                    </li>
                `;

            });

        }

        async function listarClientes() {

            const token =
                localStorage.getItem('token');

            const resposta = await fetch(
                'http://localhost:3000/clientes',
                {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const clientes =
                await resposta.json();

            const lista =
                document.getElementById('listaClientes');

            lista.innerHTML = '';

            clientes.forEach(cliente => {

                lista.innerHTML += `
                    <li>
                        ${cliente.nome}
                        - ${cliente.telefone}
                    </li>
                `;

            });

        }

    </script>

</body>
</html>
